# Verrou des dépendances téléchargées au build (build.sh).
#
# Format : <paquet npm> <version> <integrity sha512 telle que publiee par npm>
#
# Rien n'est installé via npm : build.sh télécharge ces tarballs et copie
# quelques fichiers dans dist/vendor/. Ce verrou remplace l'ancien « latest »,
# qui rendait chaque déploiement non reproductible — un changement en amont
# pouvait casser la production sans qu'un seul commit n'ait bougé ici.
#
# Pour mettre à jour une version : changer la ligne, récupérer la nouvelle
# empreinte avec
#   curl -fsSL https://registry.npmjs.org/<paquet>/<version> | grep -o '"integrity":"[^"]*"'
# puis TESTER le moteur turbo sur un vrai fichier avant de pousser.
#
# Note sur mp4box : la 2.x ne livre plus le bundle UMD « mp4box.all.js »
# (uniquement .mjs/.cjs). L'ancien build demandait « latest », échouait donc
# systématiquement sur cette version et retombait en silence sur la 0.5.2.
# C'est cette 0.5.2 qui tourne réellement en production : elle est désormais
# épinglée explicitement.

